[project]
name = "clipstack-api"
version = "0.1.0"
description = "API de upload e processamento assíncrono de vídeos com Django, DRF e Celery"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "django~=5.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "flower>=2.2.0",
    "kombu~=5.6.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "redis>=6.4,<6.5",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/W: pycodestyle | F: pyflakes | I: isort | B: bugbear | UP: pyupgrade
# DJ: regras específicas de Django | S: segurança (bandit) | SIM: simplificações
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# assert é a forma idiomática de verificar no pytest
"**/tests/**" = ["S101", "S105", "S106"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ---------------------------------------------------------------- import-linter
# Fronteiras entre apps, verificadas no CI (`lint-imports`). O Django deixa qualquer app
# importar qualquer outra; os contratos impedem dependências circulares e acoplamento.
# Direção permitida: core <- accounts <- videos <- processing / notifications.
[tool.importlinter]
root_package = "apps"

[[tool.importlinter.contracts]]
name = "core é a base: não depende das apps de domínio"
type = "forbidden"
source_modules = ["apps.core"]
forbidden_modules = ["apps.accounts", "apps.videos", "apps.processing", "apps.notifications"]

[[tool.importlinter.contracts]]
name = "accounts não depende das apps de conteúdo"
type = "forbidden"
source_modules = ["apps.accounts"]
forbidden_modules = ["apps.videos", "apps.processing", "apps.notifications"]

[[tool.importlinter.contracts]]
name = "videos não conhece processing nem notifications"
type = "forbidden"
source_modules = ["apps.videos"]
forbidden_modules = ["apps.processing", "apps.notifications"]

[[tool.importlinter.contracts]]
name = "notifications não depende de processing (evita ciclo)"
type = "forbidden"
source_modules = ["apps.notifications"]
forbidden_modules = ["apps.processing"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "--reuse-db -ra"
