# Ambiente local.
#   Só a infraestrutura (Django rodando no host com uv):  docker compose up -d postgres redis rabbitmq
#   Infra + workers do Celery, beat e flower:             docker compose up -d
#   Tudo, inclusive a API com Gunicorn (profile "app"):   docker compose --profile app up -d
name: clipstack

# Configuração comum dos serviços que usam a imagem do projeto (âncora YAML).
x-app: &app
  build: .
  # Nome fixo: os serviços abaixo reaproveitam a MESMA imagem em vez de uma por serviço.
  image: clipstack-api:local
  env_file: .env
  environment: &app-env
    # Dentro da rede do compose, os serviços se acham pelo nome (postgres, redis, rabbitmq).
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DJANGO_ALLOWED_HOSTS: "*"
    DJANGO_SECURE_SSL_REDIRECT: "False"
    DJANGO_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    DATABASE_URL: postgres://${POSTGRES_USER:-clipstack}:${POSTGRES_PASSWORD:-clipstack}@postgres:5432/${POSTGRES_DB:-clipstack}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-clipstack}:${RABBITMQ_PASSWORD:-clipstack}@rabbitmq:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    VIDEO_PROCESSOR_CLASS: apps.processing.processors.FfmpegVideoProcessor
  volumes:
    # Mídia COMPARTILHADA: o vídeo é salvo por quem recebe o upload (Django) e lido pelo worker,
    # que roda em outro container. Sem o mesmo diretório, o worker não acharia o arquivo.
    # Em produção isso vira um object storage (S3) com django-storages.
    - ./media:/app/media
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipstack}
      POSTGRES_USER: ${POSTGRES_USER:-clipstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipstack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a `docker compose down` (só somem com `down -v`).
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql (não mais .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # pg_isready: responde OK só quando o Postgres já aceita conexões.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Cache (estatísticas), contadores de throttling e result backend do Celery.
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # Broker do Celery. A imagem "-management" traz o painel web em http://localhost:15672.
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-clipstack}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-clipstack}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    profiles: [app]
    # Passo ÚNICO antes da API subir. Se cada container web rodasse migrate ao iniciar, várias
    # réplicas disputariam as mesmas migrations ao mesmo tempo (e um deploy com N réplicas
    # rodaria N vezes). Em produção, é um job de release separado.
    command: python manage.py migrate --noinput
    restart: "no"

  web:
    <<: *app
    profiles: [app]
    # CMD da imagem: Gunicorn com 3 workers sync.
    environment:
      <<: *app-env
      SERVE_MEDIA: "True"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      # Só sobe depois que o migrate TERMINOU com sucesso.
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5

  worker-processing:
    <<: *app
    # Só a fila "processing" (vídeos). Poucos processos (-c 2): cada um roda ffmpeg (CPU).
    command: >
      celery -A config worker -Q processing -c 2 -n processing@%h --loglevel=INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d processing@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3

  worker-default:
    <<: *app
    # Só a fila "default" (notificações e emails): tarefas curtas, mais concorrência.
    command: >
      celery -A config worker -Q default -c 4 -n default@%h --loglevel=INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d default@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3

  beat:
    <<: *app
    # UMA instância só: duas publicariam cada tarefa periódica em dobro.
    command: celery -A config beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    volumes: []

  flower:
    <<: *app
    # Painel do Celery em http://localhost:5555 (workers, tasks, retries, tempos).
    command: >
      celery -A config flower --port=5555
      --broker_api=http://${RABBITMQ_USER:-clipstack}:${RABBITMQ_PASSWORD:-clipstack}@rabbitmq:15672/api/
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    volumes: []

volumes:
  postgres_data:
  rabbitmq_data:
